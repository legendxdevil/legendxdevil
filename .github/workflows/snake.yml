name: Generate Snake

on:
  # Har 12 ghante mein auto-update
  schedule:
    - cron: "0 */12 * * *"
  # Actions tab se manually run karne ke liye
  workflow_dispatch:
  # Jab bhi main branch mein push ho
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake.svg (red theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=ff0000&color_dots=161b22,5c1010,8b1a1a,b91c1c,ff2a2a

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
