name: Generate Snake

on:
  # Har 12 ghante mein auto-update
  schedule:
    - cron: "0 */12 * * *"
  # Actions tab se manually run karne ke liye
  workflow_dispatch:
  # Jab bhi main branch mein push ho
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23ff0000&color_dots=%23161b22,%235c1010,%238b1a1a,%23b91c1c,%23ff2a2a
            dist/snake-dark.svg?color_snake=%23ff0000&color_dots=%23161b22,%235c1010,%238b1a1a,%23b91c1c,%23ff2a2a
            dist/snake-light.svg?color_snake=%23ff0000&color_dots=%23ebedf0,%23ffcdd2,%23e57373,%23e53935,%23b71c1c

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0D1117&color=FF0000&line=B91C1C&point=FFFFFF&area=true&area_color=B91C1C&hide_border=true&title_color=FF0000
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
